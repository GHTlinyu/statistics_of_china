# 生产 nginx 配置：HTTP 跳转 HTTPS，443 承载前端静态 + /api 反代后端（SSE 适配）
# 运行在 host 网络，后端只听 127.0.0.1:8000，此处 proxy_pass 走本机回环。
# 证书挂载：宿主机 /opt/statistics_of_china/deploy/nginx/certs → 容器 /etc/nginx/certs（只读）

# HTTP：全部跳转 HTTPS
# 注：若以后改用 acme.sh HTTP-01 验证续期，需要给 /.well-known/acme-challenge/ 加例外
server {
    listen 80;
    server_name creative-idea-generator.site www.creative-idea-generator.site _;

    return 301 https://$host$request_uri;
}

# HTTPS：静态 + 反代
server {
    listen 443 ssl;
    http2 on;
    server_name creative-idea-generator.site www.creative-idea-generator.site;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # 访问日志（容器内 stdout，由 docker 收集）
    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 带 hash 的构建产物长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端反代：/api 前缀与前端约定一致（app.tsx baseURL: '/api'）
    # 尾部斜杠必须保留，用于剥掉 /api 前缀
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 聊天流必需：关闭缓冲与缓存，否则回答会被攒满才吐出
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
