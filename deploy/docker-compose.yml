# 《中国统计年鉴 2025》智能助手 —— 生产部署编排
#
# 拓扑：nginx（host 网络，80/443 对外）+ backend（host 网络，仅 127.0.0.1:8000）
#       PostgreSQL 跑在宿主机（已部署，仅本机监听），backend 经 127.0.0.1 直连
#
# 使用：
#   cp deploy/.env.docker.example deploy/.env.docker   # 填入真实密钥
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# host 网络下不能声明 ports 映射；对外暴露面只有 nginx 监听的 80/443。

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    # 镜像名必须与 CI 构建/load 的 tag 一致（soc-backend:latest），
    # 不写 image 时 compose 会按项目目录名自动推导成 deploy-backend:latest
    image: soc-backend:latest
    env_file: .env.docker
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    image: soc-nginx:latest
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      # 证书由服务器手工维护（CI 不覆盖该目录），只读挂载进容器
      - /opt/statistics_of_china/deploy/nginx/certs:/etc/nginx/certs:ro
