# 生产部署流水线：测试 → 构建镜像 → 传服务器 → 加载启动
#
# 模式：GitHub runner 构建镜像，docker save 后 scp 上传，服务器 docker load 后 compose up。
# 不需要任何镜像仓库。
#
# 依赖的 GitHub Secrets（与 SSH 连接测试一致）：
#   ECS_SSH_PRIVATE_KEY   部署专用私钥（服务器对应用户的 ~/.ssh/authorized_keys 已放公钥）
#   ECS_USER              部署用户
#   ECS_HOST              服务器 IP 或域名
#
# 触发：push 到 master 自动部署；也可在 Actions 页面手动 workflow_dispatch。
# 只想手动部署时，注释掉下面的 push 块。

name: deploy

on:
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v7 起使用 Node 24 运行时（v4 的 Node 20 已被 GitHub Actions 弃用）
      - uses: actions/checkout@v7.0.1

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: uv sync --all-packages

      - name: 运行单元测试
        run: uv run --package statistics-of-china-backend pytest backend/tests -q

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ECS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: 构建后端镜像
        run: docker build -f deploy/backend/Dockerfile -t soc-backend:latest .

      - name: 构建前端 + nginx 镜像
        run: docker build -f deploy/nginx/Dockerfile -t soc-nginx:latest .

      - name: 导出镜像（gzip 打包，压缩速度优先）
        run: |
          docker save soc-backend:latest | gzip -1 > soc-backend.tar.gz
          docker save soc-nginx:latest | gzip -1 > soc-nginx.tar.gz
          ls -lh *.tar.gz

      - name: 上传镜像与部署文件到服务器
        timeout-minutes: 30
        run: |
          echo "[upload] $(date -u '+%H:%M:%S') 本地待传文件："
          ls -lh soc-backend.tar.gz soc-nginx.tar.gz deploy/docker-compose.yml

          echo "[upload] $(date -u '+%H:%M:%S') 准备服务器目录 /tmp/soc-deploy"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" \
            "mkdir -p /tmp/soc-deploy"

          echo "[upload] $(date -u '+%H:%M:%S') 开始上传 soc-backend.tar.gz（可查看 -v 输出确认在传输）"
          scp -v -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            soc-backend.tar.gz \
            "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/tmp/soc-deploy/"
          echo "[upload] $(date -u '+%H:%M:%S') soc-backend.tar.gz 上传完成"

          echo "[upload] $(date -u '+%H:%M:%S') 开始上传 soc-nginx.tar.gz"
          scp -v -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            soc-nginx.tar.gz \
            "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/tmp/soc-deploy/"
          echo "[upload] $(date -u '+%H:%M:%S') soc-nginx.tar.gz 上传完成"

          echo "[upload] $(date -u '+%H:%M:%S') 开始上传 docker-compose.yml"
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            deploy/docker-compose.yml \
            "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/tmp/soc-deploy/"
          echo "[upload] $(date -u '+%H:%M:%S') docker-compose.yml 上传完成"

          echo "[upload] 服务器端文件校验（应与上面 ls -lh 一致）："
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" \
            "ls -lh /tmp/soc-deploy/ && du -sb /tmp/soc-deploy/"

      - name: 服务器放置部署文件
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          trap 'echo "[deploy] 失败：第 $LINENO 行，退出码 $?"' ERR

          echo "[deploy][1/4] 准备部署目录 /opt/statistics_of_china/deploy"
          mkdir -p /opt/statistics_of_china/deploy

          echo "[deploy][2/4] 覆盖 docker-compose.yml（服务器不再依赖 git）"
          cp /tmp/soc-deploy/docker-compose.yml \
            /opt/statistics_of_china/deploy/docker-compose.yml
          echo "[deploy][2/4] 部署文件就位："
          ls -lh /opt/statistics_of_china/deploy/
          REMOTE

      - name: 服务器加载新镜像
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          trap 'echo "[deploy] 失败：第 $LINENO 行，退出码 $?"' ERR

          echo "[deploy][3/4] 保留上一版镜像用于回滚"
          docker tag soc-backend:latest soc-backend:previous 2>/dev/null || true
          docker tag soc-nginx:latest soc-nginx:previous 2>/dev/null || true

          echo "[deploy][4/4] docker load soc-backend.tar.gz 开始"
          gunzip -c /tmp/soc-deploy/soc-backend.tar.gz | docker load
          echo "[deploy][4/4] soc-backend 加载完成"

          echo "[deploy][4/4] docker load soc-nginx.tar.gz 开始"
          gunzip -c /tmp/soc-deploy/soc-nginx.tar.gz | docker load
          echo "[deploy][4/4] soc-nginx 加载完成"
          REMOTE

      - name: 服务器重启服务与清理
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          trap 'echo "[deploy] 失败：第 $LINENO 行，退出码 $?"' ERR

          echo "[deploy][5/5] compose up 开始"
          cd /opt/statistics_of_china
          docker compose -f deploy/docker-compose.yml up -d --no-build
          echo "[deploy][5/5] compose up 完成"

          echo "[deploy][5/5] 清理临时文件与悬空镜像"
          rm -rf /tmp/soc-deploy
          docker image prune -f

          echo "[deploy][5/5] 容器状态："
          docker compose -f deploy/docker-compose.yml ps
          REMOTE
